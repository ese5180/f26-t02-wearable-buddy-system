# Optional MCUboot UART0 recovery; enabled only by build.py --serial-recovery.
CONFIG_SERIAL=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=3000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_VALIDATE_SLOT0=y

# ESP32 Xtensa single-thread boot leaves UART IRQ reception inactive.
CONFIG_MULTITHREADING=y
