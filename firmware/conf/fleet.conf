# Optional overlay: keep the validated BLE/LoRa and MCUboot layout.
CONFIG_MEMFAULT=y
CONFIG_BUDDYGUARD_FLEET=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_SHELL_SELF_TEST=y
CONFIG_MEMFAULT_USER_CONFIG_SILENT_FAIL=n
CONFIG_MEMFAULT_METRICS=y
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=8192
CONFIG_HWINFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_MEMFAULT_METRICS_DEFAULT_SET_ENABLE=y
# SDK 1.46 provides an exception-safe flash backend for ESP32-S3.
# Use spare space inside slot1; do not move any deployed MCUboot partition.
CONFIG_MEMFAULT_COREDUMP_STORAGE_ESP32_FLASH=y
CONFIG_MEMFAULT_COREDUMP_STORAGE_ESP32_FLASH_MCUBOOT_SECONDARY_SLOT=y
CONFIG_MEMFAULT_COREDUMP_STORAGE_ESP32_FLASH_MCUBOOT_SECONDARY_SLOT_SIZE=0x20000
CONFIG_MEMFAULT_COREDUMP_STORAGE_ESP32_FLASH_MCUBOOT_TRAILER_RESERVE=0x10000
CONFIG_MEMFAULT_COREDUMP_ACTIVE_TASK_STACK_SIZE_TO_COLLECT=2048
CONFIG_MEMFAULT_COREDUMP_STACK_SIZE_TO_COLLECT=512
